---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Shell tool test/validation workflow
name: "Test Shell Scripts 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Run the test suite on both supported platforms ###
  tests:
    name: "Test on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Linux covers bash and the GNU userland; macOS covers zsh, the
        # BSD userland, and the bash 3.2 that Apple still ships. The test
        # suite skips a shell it cannot find, so neither runner needs
        # extra packages -- which also keeps the egress allow-list below
        # from having to reach a distribution mirror.
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: '@18d9c4446bea555d0783e850f6d295f844fe8f67'  # v0.1.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Report the shells under test"
        shell: bash
        run: |
          # Report the shells under test
          for candidate in bash zsh; do
            if command -v "$candidate" > /dev/null 2>&1; then
              echo "$candidate: $("$candidate" --version | head -1)"
            else
              echo "$candidate: not installed; its tests will be skipped"
            fi
          done

      - name: "Run the test suite"
        shell: bash
        run: |
          # Run the test suite
          ./tests/run-tests.sh

      # The suite reports a missing shell as a skip rather than a
      # failure, which is right for a laptop but would let a broken
      # matrix leg pass silently here. Both runners are known to carry
      # bash and zsh, so demand them.
      - name: "Require both shells to have run"
        shell: bash
        run: |
          # Require both shells to have run
          missing=0
          for required in bash zsh; do
            if ! command -v "$required" > /dev/null 2>&1; then
              echo "Error: $required is absent from ${{ matrix.os }} ❌"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Tested against bash and zsh on ${{ matrix.os }} ✅"
          echo "Tested against bash and zsh on ${{ matrix.os }} ✅" \
            >> "$GITHUB_STEP_SUMMARY"

      # An installer that cannot be undone is worse than no installer.
      # The suite proves this in a sandbox HOME; do it once more against
      # the runner's real HOME, which is the shape a colleague meets.
      - name: "Install and uninstall against the real HOME"
        shell: bash
        run: |
          # Install and uninstall against the real HOME
          ./install.sh --yes
          ./install.sh --status
          grep -q 'LFRELENG_SHELL_SCRIPTS' "$HOME/.bashrc"
          ./install.sh --uninstall
          if grep -q 'lfreleng-actions/shell-scripts' "$HOME/.bashrc"; then
            echo "Error: uninstall left the block behind ❌"
            exit 1
          fi
          echo "Install and uninstall round-tripped cleanly ✅"
